<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<title>Barbell Coach</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-tap-highlight-color:transparent}
body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0f0f1a;color:#e2e8f0;font-size:16px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
  position:relative;overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.screen-inner{padding:0 16px}
.page-hdr{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
.card{background:#1a1a2e;border-radius:14px;padding:16px;margin-bottom:12px}
.card-sm{background:#1e1e35;border-radius:10px;padding:12px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
  border-radius:10px;padding:10px 18px;font-size:.95rem;font-weight:600;cursor:pointer;
  transition:all .15s;color:#fff}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);width:100%;padding:15px;font-size:1rem}
.btn-secondary{background:#252545;color:#a5b4fc}
.btn-success{background:#15803d}
.btn-danger{background:#b91c1c}
.btn-ghost{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn-sm{padding:7px 14px;font-size:.85rem;border-radius:8px}
.btn-block{width:100%}
.btn-icon{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;
  background:#1e2a3a;color:#94a3b8;display:inline-flex;align-items:center;
  justify-content:center;font-size:.88rem;flex-shrink:0}
.btn-icon.red{background:#3f1212;color:#f87171}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
  max-width:480px;background:#111126;border-top:1px solid #1e2a3a;display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;
  cursor:pointer;color:#475569;font-size:.68rem;font-weight:600;gap:2px;border:none;
  background:transparent;transition:color .15s}
.nav-item.active{color:#818cf8}
.nav-item .ni{font-size:1.25rem}
/* Exercise cards */
.ex-card{border-radius:12px;overflow:hidden;margin-bottom:10px}
.ex-card-hdr{background:#1a1a2e;border-left:4px solid var(--c,#6366f1);padding:12px;
  display:flex;align-items:center;gap:8px;cursor:pointer}
.ex-card-hdr .ex-name{font-weight:600;font-size:.92rem;flex:1}
.ex-card-hdr .ex-sug{font-size:.73rem;color:#94a3b8}
.ex-card-hdr .chev{color:#475569;font-size:.8rem;transition:transform .2s;margin-left:4px}
.ex-card-hdr.open .chev{transform:rotate(180deg)}
.ex-card-body{background:#171730;padding:12px;display:none}
.ex-card-body.open{display:block}
/* Set rows */
.set-row{display:flex;align-items:center;gap:5px;padding:6px 0;border-bottom:1px solid #1e2a3a}
.set-row:last-child{border-bottom:none}
.set-row.done{opacity:.6}
.set-num{font-size:.75rem;color:#475569;width:22px;text-align:center;flex-shrink:0}
.nc{display:flex;align-items:center;gap:2px}
.nc input{width:48px;text-align:center;background:#0f0f1a;border:1px solid #2a3a4a;
  border-radius:7px;padding:5px 2px;color:#e2e8f0;font-size:.88rem;font-weight:600;
  -webkit-appearance:none;appearance:none}
.nc input:focus{outline:none;border-color:#6366f1}
.nc-btn{width:24px;height:24px;border-radius:6px;border:none;background:#252545;
  color:#e2e8f0;font-size:1rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;line-height:1}
.set-x{color:#334155;font-size:.75rem;margin:0 2px;flex-shrink:0}
.set-chk{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;
  background:#1e2a3a;color:#64748b;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;flex-shrink:0;transition:all .2s}
.set-chk.done{background:#14532d;color:#4ade80}
.set-pr{color:#f59e0b;font-size:.7rem;flex-shrink:0;margin-left:2px}
.ex-controls{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid #1e2a3a;flex-wrap:wrap}
/* Timer overlay */
.timer-ov{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;
  max-width:480px;background:#0a1f10;border-bottom:2px solid #166534;padding:10px 14px;
  z-index:200;display:flex;align-items:center;gap:8px;
  padding-top:max(10px,env(safe-area-inset-top))}
.timer-ov.hidden{display:none}
.timer-lbl{font-size:.78rem;color:#86efac;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-cnt{font-size:1.1rem;font-weight:700;color:#4ade80;min-width:34px;text-align:center}
.timer-bw{flex:2;height:5px;background:#1a3020;border-radius:3px;overflow:hidden}
.timer-bf{height:100%;background:#22c55e;transition:width .9s linear}
.timer-skip{background:transparent;border:none;color:#4ade80;font-size:.78rem;cursor:pointer;padding:0 2px}
/* Toast */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
  background:#1e293b;border:1px solid #475569;border-radius:10px;
  padding:9px 18px;font-size:.85rem;font-weight:500;z-index:400;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.pr{background:#451a03;border-color:#d97706;color:#fbbf24}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:300;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:#1a1a2e;border-radius:20px 20px 0 0;padding:20px 18px 32px;
  width:100%;max-width:480px;transform:translateY(100%);transition:transform .25s;
  display:flex;flex-direction:column;max-height:88vh}
.modal-bg.open .modal{transform:translateY(0)}
.modal h3{margin-bottom:8px;font-size:1rem}
.modal p{color:#94a3b8;font-size:.88rem;line-height:1.5}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1}
.ex-picker-list{overflow-y:auto;flex:1;margin:10px 0}
.ex-picker-cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;
  color:#475569;font-weight:700;padding:8px 0 4px}
.ex-picker-item{display:flex;align-items:center;gap:10px;padding:10px;
  border-radius:10px;margin-bottom:3px;cursor:pointer;background:#1e1e35;
  transition:background .1s}
.ex-picker-item:active{background:#252550}
.ex-picker-icon{font-size:1.05rem;width:24px;text-align:center}
.ex-picker-name{flex:1;font-size:.88rem;font-weight:500}
.ex-picker-sug{font-size:.75rem;color:#64748b}
/* Home */
.home-hero{background:linear-gradient(135deg,#2e1065,#1e1b4b);border-radius:16px;
  padding:22px;margin-bottom:14px;border:1px solid #4338ca;cursor:pointer;transition:opacity .15s}
.home-hero:active{opacity:.8}
.hero-emoji{font-size:2.5rem;margin-bottom:8px;line-height:1}
.hero-title{font-size:1.2rem;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:.83rem;color:#a5b4fc}
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.prog-item{background:#1a1a2e;border-radius:10px;padding:10px 12px;
  border-left:3px solid var(--c,#6366f1)}
.prog-nm{font-size:.68rem;color:#64748b;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-wt{font-size:1.05rem;font-weight:700}
.prog-st{font-size:.68rem;margin-top:2px}
.prog-st.up{color:#4ade80}.prog-st.hold{color:#64748b}
/* History */
.hist-card{background:#1a1a2e;border-radius:12px;margin-bottom:10px;overflow:hidden}
.hist-hdr{display:flex;align-items:center;padding:12px;cursor:pointer;gap:10px}
.hist-date{font-weight:600;font-size:.88rem;flex:1}
.hist-meta{font-size:.76rem;color:#64748b}
.hist-body{padding:0 12px 12px;display:none}
.hist-body.open{display:block}
.hist-ex{margin-bottom:8px}
.hist-ex-nm{font-size:.8rem;font-weight:600;color:#a5b4fc;margin-bottom:3px}
.hist-sets{font-size:.78rem;color:#94a3b8;line-height:1.8}
/* Settings */
.s-row{background:#1a1a2e;border-radius:10px;margin-bottom:6px;display:flex;
  align-items:center;padding:10px 12px;gap:10px}
.s-row .ri{font-size:1rem;width:24px;text-align:center}
.s-row .rinfo{flex:1}
.s-row .rname{font-size:.88rem;font-weight:500}
.s-row .rmeta{font-size:.73rem;color:#64748b}
/* Done */
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.done-stat{background:#1a1a2e;border-radius:12px;padding:13px;text-align:center}
.done-stat .dsv{font-size:1.4rem;font-weight:700;color:#818cf8}
.done-stat .dsl{font-size:.7rem;color:#64748b;margin-top:3px}
/* Workout header */
.wk-hdr{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;
  background:#111126;border-bottom:1px solid #1e2a3a;position:sticky;top:0;z-index:10}
.wk-title{font-weight:700;font-size:1rem;flex:1}
.wk-elapsed{font-size:.8rem;color:#64748b}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.chip-up{background:#14532d;color:#4ade80}
.chip-hold{background:#1e293b;color:#64748b}
.chip-pr{background:#451a03;color:#f59e0b}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;
  color:#475569;font-weight:700;padding:14px 0 7px}
@keyframes prGlow{0%,100%{background:#0f0f1a}50%{background:#451a03}}
.pr-flash{animation:prGlow 1.2s ease 3}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
</style>
</head>

// ── STORAGE ───────────────────────────────────────────────────────────────────
function lsOk() {
  try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }
  catch(e) { return false; }
}
function persist() {
  if (!lsOk()) return;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      v: 2,
      sessions: S.sessions,
      customRoutines: S.customRoutines,
      saved: new Date().toISOString()
    }));
  } catch(e) {}
}
function loadFromStorage() {
  if (!lsOk()) return;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.v === 2) {
      if (d.customRoutines) S.customRoutines = d.customRoutines;
      if (d.sessions && d.sessions.length > 0) {
        // Merge: always include all seed sessions, plus any user sessions not in seed
        const seedIds = new Set(SEED_SESSIONS.map(s => s.id));
        const userExtra = d.sessions.filter(s => !seedIds.has(s.id));
        if (userExtra.length > 0) {
          S.sessions = [...SEED_SESSIONS, ...userExtra]
            .sort((a,b) => new Date(b.date) - new Date(a.date));
        }
        // If user had deleted a seed session, we still restore it from seed
        // (design choice: seed data is always authoritative)
      }
    }
  } catch(e) {}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function isCore(n) { return EXERCISE_CFG[n]?.cat === 'core'; }
function cfg(n) { return EXERCISE_CFG[n] || {icon:'💪',cat:'upper',inc:5,color:'#6366f1'}; }
function fmtDate(d) {
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function sessMaxW(sets) {
  const ws = sets.map(s=>s.w||0).filter(w=>w>0);
  return ws.length ? Math.max(...ws) : 0;
}
function epley1RM(w, r) { return r > 1 ? w * (1 + r/30) : w; }

function getSuggestion(exName) {
  const {inc} = cfg(exName);
  if (isCore(exName)) return {weight:0, note:'Bodyweight / reps focus', inc:false};
  const rel = S.sessions
    .filter(s => s.exercises.some(e => e.name === exName))
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  if (!rel.length) return {weight:0, note:'No history — enter starting weight', inc:false};
  const lastEx = rel[0].exercises.find(e => e.name === exName);
  const lastSets = lastEx.sets.filter(s => s.w > 0 || s.r > 0);
  if (!lastSets.length) return {weight:0, note:'No weight logged yet', inc:false};
  const maxW = sessMaxW(lastSets);
  let overCount = 0;
  for (const sess of rel) {
    const ex = sess.exercises.find(e => e.name === exName);
    if (!ex) continue;
    const sets = ex.sets.filter(s => s.w > 0 || s.r > 0);
    if (!sets.length) continue;
    const tr = typeof ex.targetReps === 'string' ? 8 : (ex.targetReps || 8);
    const mw = sessMaxW(sets);
    if (!mw) continue;
    const heavy = sets.filter(s => s.w === mw);
    if (heavy.length && heavy.every(s => s.r > tr)) overCount++;
  }
  if (overCount >= OVERLOAD_SESSIONS) {
    return {weight: maxW + inc, note: `+${inc} lbs — ${overCount} sessions over target ✓`, inc:true, lastW:maxW};
  }
  return {weight: maxW, note: `Hold — ${overCount}/${OVERLOAD_SESSIONS} over target`, inc:false, lastW:maxW};
}

function checkPR(exName, w, r) {
  if (isCore(exName) || !w || !r) return false;
  const new1RM = epley1RM(w, r);
  for (const sess of S.sessions) {
    const ex = sess.exercises.find(e => e.name === exName);
    if (!ex) continue;
    for (const set of ex.sets) {
      if (set.w > 0 && set.r > 0 && epley1RM(set.w, set.r) >= new1RM) return false;
    }
  }
  return new1RM > 0;
}

function fmtElapsed(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function getCurrentRoutine() {
  return S.customRoutines.default || DEFAULT_ROUTINE;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ── TIMER ─────────────────────────────────────────────────────────────────────
function startTimer(exName) {
  stopTimer();
  S.timerActive = true;
  S.timerSec = REST_SEC;
  S.timerTotal = REST_SEC;
  S.timerEx = exName;
  updateTimerDOM();
  document.getElementById('timer-ov')?.classList.remove('hidden');
  S.timerInterval = setInterval(() => {
    S.timerSec--;
    if (S.timerSec <= 0) {
      stopTimer();
      showToast('Rest done — go! 💪');
    } else {
      updateTimerDOM();
    }
  }, 1000);
}
function stopTimer() {
  clearInterval(S.timerInterval);
  S.timerInterval = null;
  S.timerActive = false;
  document.getElementById('timer-ov')?.classList.add('hidden');
}
function updateTimerDOM() {
  const cnt = document.getElementById('timer-cnt');
  const fill = document.getElementById('timer-bf');
  const lbl = document.getElementById('timer-lbl');
  if (cnt) cnt.textContent = S.timerSec + 's';
  if (fill) fill.style.width = (S.timerSec / S.timerTotal * 100) + '%';
  if (lbl) lbl.textContent = 'Rest · ' + S.timerEx;
}

// ── ELAPSED TIMER ────────────────────────────────────────────────────────────
function startElapsed() {
  clearInterval(S.elapsedInterval);
  S.elapsedInterval = setInterval(() => {
    const el = document.getElementById('wk-elapsed');
    if (el && S.wkStart) el.textContent = fmtElapsed(Date.now() - S.wkStart);
  }, 1000);
}
function stopElapsed() {
  clearInterval(S.elapsedInterval);
  S.elapsedInterval = null;
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id)?.classList.add('open'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  let content = '';
  if (S.wkPhase === 'active') {
    content = renderActiveWorkout();
  } else if (S.wkPhase === 'done') {
    content = renderWorkoutDone();
  } else if (S.view === 'history') {
    content = renderHistory();
  } else if (S.view === 'settings') {
    content = renderSettings();
  } else {
    content = renderHome();
  }

  const nav = (S.wkPhase === 'idle') ? `
    <nav class="bottom-nav">
      <button class="nav-item ${S.view==='home'?'active':''}" onclick="nav('home')">
        <span class="ni">🏠</span>Home
      </button>
      <button class="nav-item ${S.view==='history'?'active':''}" onclick="nav('history')">
        <span class="ni">📋</span>History
      </button>
      <button class="nav-item ${S.view==='settings'?'active':''}" onclick="nav('settings')">
        <span class="ni">⚙️</span>Settings
      </button>
    </nav>` : '';

  app.innerHTML = `
    <div id="timer-ov" class="timer-ov hidden">
      <span id="timer-lbl" class="timer-lbl">Rest</span>
      <div class="timer-bw"><div id="timer-bf" class="timer-bf" style="width:100%"></div></div>
      <span id="timer-cnt" class="timer-cnt">60s</span>
      <button class="timer-skip" onclick="stopTimer()">Skip ✕</button>
    </div>
    <div class="screen">${content}</div>
    ${nav}
    ${renderModals()}
  `;

  if (S.timerActive) updateTimerDOM();
  if (S.timerActive) document.getElementById('timer-ov')?.classList.remove('hidden');
  if (S.wkPhase === 'active') startElapsed();
}

function nav(v) {
  S.view = v;
  render();
}

// ── HOME ──────────────────────────────────────────────────────────────────────

  const lastSess = S.sessions[0];
  const lastDate = lastSess ? fmtDate(lastSess.date) : 'No sessions yet';

    return `<div class="prog-item" style="--c:${c.color}">
      <div class="prog-nm">${c.icon} ${name.replace('Barbell ','').replace('Romanian ','RDL ')}</div>
      <div class="prog-wt">${sug.lastW||sug.weight||'?'} lbs</div>
      <div class="prog-st ${cls}">${status}</div>

    <div class="prog-grid">${progItems}</div>

    ${lastSess ? `
    <div class="section-title">Last Workout</div>
    <div class="card-sm">
      <div style="font-size:.82rem;color:#64748b;margin-bottom:8px">${fmtDate(lastSess.date)} · ${lastSess.label}</div>
      ${lastSess.exercises.slice(0,4).map(ex => {
        const done = ex.sets.filter(s=>s.w>0&&s.r>0);
        if (!done.length) return '';
        const best = done.reduce((a,b)=>b.r>a.r?b:a,done[0]);
        return `<div style="font-size:.82rem;color:#94a3b8;display:flex;justify-content:space-between;margin-bottom:3px">
          <span>${cfg(ex.name).icon} ${ex.name.replace('Barbell ','')}</span>
          <span style="color:#e2e8f0">${best.w>0?best.w+'lbs ×':''} ${best.r} reps</span>
        </div>`;
      }).join('')}
      ${lastSess.exercises.length > 4 ? `<div style="font-size:.75rem;color:#475569;margin-top:4px">+${lastSess.exercises.length-4} more</div>` : ''}
    </div>` : ''}
  </div>`;
}

// ── ACTIVE WORKOUT ────────────────────────────────────────────────────────────
function startWorkout() {
  const routine = getCurrentRoutine();
  const exercises = routine.map(item => {
    const sug = getSuggestion(item.name);
    const w = sug.weight || 0;
    const sets = [];
    for (let i = 0; i < item.sets; i++) {
      sets.push({w, r:0, n:'', done:false, isPR:false});
    }
    return {name: item.name, targetSets: item.sets, targetReps: item.targetReps, sets, suggestion: sug};
  });
  S.wkSession = {
    id: 's' + Date.now() + Math.random().toString(36).slice(2,6),
    date: new Date().toISOString().slice(0,10),
    type: 'default',
    label: 'Full Body',
    notes: '',
    startTime: Date.now(),
    exercises,
  };
  S.wkStart = Date.now();
  S.wkPhase = 'active';
  S.exOpen = {};
  exercises.forEach(ex => { S.exOpen[ex.name] = true; });
  render();
}

function renderActiveWorkout() {
  if (!S.wkSession) return '';
  const elapsed = S.wkStart ? fmtElapsed(Date.now() - S.wkStart) : '0:00';
  const exHTML = S.wkSession.exercises.map((ex, ei) => buildExCard(ex, ei)).join('');

  return `
    <div class="wk-hdr">
      <div class="wk-title">💪 Full Body</div>
      <div id="wk-elapsed" class="wk-elapsed">${elapsed}</div>
      <button class="btn btn-sm btn-success" onclick="finishWorkout()">Finish</button>
    </div>
    <div class="screen-inner" style="padding-top:8px">
      ${exHTML}
      <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:4px"
        onclick="openAddExModal('workout')">＋ Add Exercise</button>
      <div style="height:12px"></div>
      <button class="btn btn-ghost btn-block" onclick="confirmDiscardWorkout()">Discard Workout</button>
    </div>`;
}

function buildExCard(ex, ei) {
  const c = cfg(ex.name);
  const sug = ex.suggestion;
  const isOpen = S.exOpen[ex.name] !== false;
  const sugChip = sug ? (sug.inc
    ? `<span class="chip chip-up">↑ ${sug.weight} lbs</span>`
    : sug.weight ? `<span class="chip chip-hold">${sug.weight} lbs</span>` : '') : '';

  const setsHTML = ex.sets.map((set, si) => {
    const isDone = set.done;
    return `<div class="set-row${isDone?' done':''}" id="set-${ei}-${si}">
      <span class="set-num">${si+1}</span>
      <div class="nc">
        <button class="nc-btn" onclick="stepVal('w-${ei}-${si}',-5,0)">−</button>
        <input id="w-${ei}-${si}" type="number" inputmode="decimal" value="${set.w||''}"
          placeholder="lbs" min="0" step="5"
          onchange="syncInput('w','${ei}','${si}')"
          ${isDone?'disabled':''}>
        <button class="nc-btn" onclick="stepVal('w-${ei}-${si}',5,0)">+</button>
      </div>
      <span class="set-x">×</span>
      <div class="nc">
        <button class="nc-btn" onclick="stepVal('r-${ei}-${si}',-1,0)">−</button>
        <input id="r-${ei}-${si}" type="number" inputmode="numeric" value="${set.r||''}"
          placeholder="reps" min="0" step="1"
          onchange="syncInput('r','${ei}','${si}')"
          ${isDone?'disabled':''}>
        <button class="nc-btn" onclick="stepVal('r-${ei}-${si}',1,0)">+</button>
      </div>
      <button class="set-chk${isDone?' done':''}" onclick="markSetDone(${ei},${si})">
        ${isDone?'✓':'○'}
      </button>
      ${set.isPR ? '<span class="set-pr">🏆PR</span>' : ''}
    </div>`;
  }).join('');

  return `<div class="ex-card" id="ex-card-${ei}">
    <div class="ex-card-hdr${isOpen?' open':''}" style="--c:${c.color}"
      onclick="toggleEx(${ei})">
      <span style="font-size:1.1rem">${c.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-sug">${sug?.note||''}</div>
      </div>
      ${sugChip}
      <button class="btn-icon red" style="margin-left:6px"
        onclick="event.stopPropagation();openDelExModal(${ei})">🗑</button>
      <span class="chev">▾</span>
    </div>
    <div class="ex-card-body${isOpen?' open':''}">
      ${setsHTML}
      <div class="ex-controls">
        <button class="btn btn-sm btn-secondary" onclick="removeSet(${ei})">− Set</button>
        <button class="btn btn-sm btn-secondary" onclick="addSet(${ei})">+ Set</button>
      </div>
    </div>
  </div>`;
}

function toggleEx(ei) {
  const ex = S.wkSession?.exercises[ei];
  if (!ex) return;
  S.exOpen[ex.name] = !S.exOpen[ex.name];
  const card = document.getElementById(`ex-card-${ei}`);
  if (card) {
    card.outerHTML = buildExCard(ex, ei);
  }
}

function stepVal(id, delta, min=0) {
  const el = document.getElementById(id);
  if (!el || !S.wkSession) return;
  const cur = parseFloat(el.value) || 0;
  const nv = Math.max(min, cur + delta);
  el.value = nv;
  const [type, ei, si] = id.split('-');
  const set = S.wkSession.exercises[+ei]?.sets[+si];
  if (!set) return;
  if (type === 'w') set.w = nv;
  else set.r = nv;
}

function syncInput(type, ei, si) {
  if (!S.wkSession) return;
  const el = document.getElementById(`${type}-${ei}-${si}`);
  if (!el) return;
  const set = S.wkSession.exercises[+ei]?.sets[+si];
  if (!set) return;
  if (type === 'w') set.w = parseFloat(el.value) || 0;
  else set.r = parseInt(el.value) || 0;
}

function markSetDone(ei, si) {
  if (!S.wkSession) return;
  const ex = S.wkSession.exercises[ei];
  const set = ex?.sets[si];
  if (!set) return;

  if (set.done) {
    set.done = false;
    set.isPR = false;
    renderActiveWorkout_partial(ei);
    return;
  }

  // Read current DOM values
  const wEl = document.getElementById(`w-${ei}-${si}`);
  const rEl = document.getElementById(`r-${ei}-${si}`);
  if (wEl) set.w = parseFloat(wEl.value) || 0;
  if (rEl) set.r = parseInt(rEl.value) || 0;

  set.done = true;

  // PR check
  if (!isCore(ex.name) && set.w > 0 && set.r > 0) {
    if (checkPR(ex.name, set.w, set.r)) {
      set.isPR = true;
      showToast('🏆 New PR! ' + ex.name.replace('Barbell ',''), 'pr');
    }
  }

  startTimer(ex.name);
  renderActiveWorkout_partial(ei);
}

function renderActiveWorkout_partial(ei) {
  if (!S.wkSession) return;
  const ex = S.wkSession.exercises[ei];
  const card = document.getElementById(`ex-card-${ei}`);
  if (card && ex) {
    card.outerHTML = buildExCard(ex, ei);
  }
}

function addSet(ei) {
  if (!S.wkSession) return;
  const ex = S.wkSession.exercises[ei];
  if (!ex) return;
  const last = ex.sets[ex.sets.length-1] || {w:0,r:0};
  ex.sets.push({w:last.w, r:0, n:'', done:false, isPR:false});
  renderActiveWorkout_partial(ei);
}

function removeSet(ei) {
  if (!S.wkSession) return;
  const ex = S.wkSession.exercises[ei];
  if (!ex || ex.sets.length <= 1) { showToast('Need at least 1 set'); return; }
  ex.sets.pop();
  renderActiveWorkout_partial(ei);
}

function openDelExModal(ei) {
  S.pendingDelEx = ei;
  const ex = S.wkSession?.exercises[ei];
  const modal = document.getElementById('del-ex-modal');
  if (modal) {
    modal.querySelector('p').textContent = `Remove "${ex?.name}" from this workout?`;
  }
  openModal('del-ex-modal');
}

function doDeleteEx() {
  if (S.pendingDelEx === null || !S.wkSession) return;
  const ex = S.wkSession.exercises[S.pendingDelEx];
  if (ex) delete S.exOpen[ex.name];
  S.wkSession.exercises.splice(S.pendingDelEx, 1);
  S.pendingDelEx = null;
  closeModal('del-ex-modal');
  render();
}

function openAddExModal(target) {
  S.addExTarget = target;
  // Build list of already-included exercises
  const used = new Set(
    target === 'workout'
      ? (S.wkSession?.exercises||[]).map(e=>e.name)
      : getCurrentRoutine().map(e=>e.name)
  );

  const cats = {upper:[], lower:[], core:[]};
  ALL_EXERCISES.forEach(name => {
    if (!used.has(name)) cats[cfg(name).cat].push(name);
  });

  const listHTML = Object.entries({upper:'Upper Body',lower:'Lower Body',core:'Core'}).map(([cat,label]) => {
    if (!cats[cat].length) return '';
    return `<div class="ex-picker-cat">${label}</div>` +
      cats[cat].map(name => {
        const c = cfg(name);
        const sug = getSuggestion(name);
        const sugText = isCore(name) ? 'Bodyweight' : sug.weight ? `${sug.weight} lbs` : 'Set weight';
        return `<div class="ex-picker-item" onclick="doAddEx('${name.replace(/'/g,"\\'")}')">
          <span class="ex-picker-icon">${c.icon}</span>
          <span class="ex-picker-name">${name}</span>
          <span class="ex-picker-sug">${sugText}</span>
        </div>`;
      }).join('');
  }).join('');

  const modal = document.getElementById('add-ex-modal');
  if (modal) {
    modal.querySelector('.ex-picker-list').innerHTML = listHTML ||
      '<div style="color:#64748b;text-align:center;padding:20px">All exercises already added</div>';
    modal.querySelector('h3').textContent =
      target === 'workout' ? 'Add Exercise to Workout' : 'Add Exercise to Routine';
  }
  openModal('add-ex-modal');
}

function doAddEx(name) {
  closeModal('add-ex-modal');
  if (S.addExTarget === 'routine') {
    const routine = [...getCurrentRoutine()];
    const tr = isCore(name) ? '8-10' : (cfg(name).cat==='lower' ? 10 : 8);
    routine.push({name, sets:3, targetReps:tr});
    S.customRoutines.default = routine;
    persist();
    render();
    return;
  }
  // Add to active workout
  if (!S.wkSession) return;
  const sug = getSuggestion(name);
  const tr = isCore(name) ? '8-10' : (cfg(name).cat==='lower' ? 10 : 8);
  const sets = [];
  for (let i=0;i<3;i++) sets.push({w:isCore(name)?0:sug.weight||0, r:0, n:'', done:false, isPR:false});
  S.wkSession.exercises.push({name, targetSets:3, targetReps:tr, sets, suggestion:sug});
  S.exOpen[name] = true;
  render();
}

function confirmDiscardWorkout() {
  openModal('discard-modal');
}

function doDiscardWorkout() {
  closeModal('discard-modal');
  stopTimer();
  stopElapsed();
  S.wkPhase = 'idle';
  S.wkSession = null;
  S.wkStart = 0;
  S.view = 'home';
  render();
}

function finishWorkout() {
  stopTimer();
  stopElapsed();
  S.wkPhase = 'done';
  render();
}

// ── WORKOUT DONE ──────────────────────────────────────────────────────────────
function renderWorkoutDone() {
  const s = S.wkSession;
  if (!s) return '';
  const durMin = Math.round((Date.now() - (s.startTime||Date.now())) / 60000);
  let totalSets=0, totalVol=0, prs=0;
  s.exercises.forEach(ex => {
    ex.sets.forEach(set => {
      if (set.done) {
        totalSets++;
        totalVol += (set.w||0)*(set.r||0);
        if (set.isPR) prs++;
      }
    });
  });

  const exSummary = s.exercises.map(ex => {
    const doneSets = ex.sets.filter(s=>s.done);
    if (!doneSets.length) return '';
    const c = cfg(ex.name);
    return `<div class="card-sm">
      <div style="font-size:.82rem;font-weight:600;color:${c.color};margin-bottom:6px">
        ${c.icon} ${ex.name}
      </div>
      ${doneSets.map((set,i)=>`
        <div style="font-size:.8rem;color:#94a3b8">
          Set ${i+1}: ${set.w>0?set.w+' lbs':isCore(ex.name)?'BW':''} × ${set.r} reps
          ${set.isPR?'<span style="color:#f59e0b"> 🏆 PR</span>':''}
        </div>`).join('')}
    </div>`;
  }).join('');

  return `<div class="screen-inner">
    <div class="page-hdr">
      <div class="page-title">✅ Workout Done!</div>
    </div>
    <div class="done-stats">
      <div class="done-stat"><div class="dsv">${durMin}</div><div class="dsl">Minutes</div></div>
      <div class="done-stat"><div class="dsv">${totalSets}</div><div class="dsl">Sets</div></div>
      <div class="done-stat"><div class="dsv">${prs>0?'🏆'+prs:totalSets>0?'💪':'-'}</div><div class="dsl">${prs>0?'PRs':'Done'}</div></div>
    </div>
    ${exSummary}
    <div style="height:16px"></div>
    <button class="btn btn-primary" onclick="saveWorkout()">Save Workout 💾</button>
    <div style="height:8px"></div>
    <button class="btn btn-ghost btn-block" onclick="confirmDiscardWorkout()">Discard</button>
  </div>`;
}

function saveWorkout() {
  if (!S.wkSession) return;
  // Clean up workout-specific flags before saving
  const saved = JSON.parse(JSON.stringify(S.wkSession));
  saved.exercises.forEach(ex => {
    ex.sets.forEach(set => { delete set.done; });
  });
  S.sessions.unshift(saved);
  persist();
  S.wkPhase = 'idle';
  S.wkSession = null;
  S.wkStart = 0;
  S.view = 'home';
  render();
  showToast('Workout saved! 💪');
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const items = S.sessions.map((sess, idx) => {
    const isOpen = S.histOpen[sess.id];
    const totalSets = sess.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.w>0||s.r>0).length,0);
    const exercises = sess.exercises.length;

    const body = isOpen ? `<div class="hist-body open">
      ${sess.exercises.map(ex=>{
        const validSets = ex.sets.filter(s=>s.w>0||s.r>0);
        if (!validSets.length) return '';
        const c = cfg(ex.name);
        return `<div class="hist-ex">
          <div class="hist-ex-nm">${c.icon} ${ex.name}</div>
          <div class="hist-sets">
            ${validSets.map((s,i)=>`<div class="hist-set-line">
              <span style="color:#475569;font-size:.72rem">S${i+1}</span>
              <span>${s.w>0?s.w+' lbs':'BW'} × ${s.r} reps${s.isPR?' 🏆':''}</span>
              ${s.n?`<span style="color:#64748b;font-size:.72rem">— ${s.n}</span>`:''}
            </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
      ${sess.notes?`<div style="font-size:.8rem;color:#64748b;margin-top:6px;padding-top:6px;border-top:1px solid #1e2a3a">📝 ${sess.notes}</div>`:''}
    </div>` : `<div class="hist-body"></div>`;

    return `<div class="hist-card">
      <div class="hist-hdr" onclick="toggleHist('${sess.id}')">
        <div>
          <div class="hist-date">${fmtDate(sess.date)}</div>
          <div class="hist-meta">${sess.label || 'Full Body'} · ${exercises} exercises · ${totalSets} sets</div>
        </div>
        <button class="btn-icon red" onclick="event.stopPropagation();openDelSessModal('${sess.id}')">🗑</button>
        <span style="color:#475569;font-size:.8rem;margin-left:4px">${isOpen?'▲':'▾'}</span>
      </div>
      ${body}
    </div>`;
  }).join('');

  return `<div class="screen-inner">
    <div class="page-hdr">
      <div class="page-title">📋 History</div>
      <span style="color:#64748b;font-size:.82rem">${S.sessions.length} sessions</span>
    </div>
    ${items || '<div style="color:#475569;text-align:center;padding:40px">No sessions yet</div>'}
  </div>`;
}

function toggleHist(id) {
  S.histOpen[id] = !S.histOpen[id];
  render();
}

function openDelSessModal(id) {
  S.pendingDelSession = id;
  const sess = S.sessions.find(s=>s.id===id);
  const modal = document.getElementById('del-sess-modal');
  if (modal && sess) {
    modal.querySelector('p').textContent = `Delete the session from ${fmtDate(sess.date)}? This cannot be undone.`;
  }
  openModal('del-sess-modal');
}

function doDeleteSession() {
  if (!S.pendingDelSession) return;
  S.sessions = S.sessions.filter(s=>s.id!==S.pendingDelSession);
  S.pendingDelSession = null;
  persist();
  closeModal('del-sess-modal');
  render();
  showToast('Session deleted');
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function renderSettings() {
  const routine = getCurrentRoutine();
  const isModified = !!S.customRoutines.default;

  const routineHTML = routine.map((ex, i) => {
    const c = cfg(ex.name);
    return `<div class="s-row" style="border-left:3px solid ${c.color}">
      <span class="ri">${c.icon}</span>
      <div class="rinfo">
        <div class="rname">${ex.name}</div>
        <div class="rmeta">${ex.sets} sets × ${ex.targetReps} reps</div>
      </div>
      <div style="display:flex;gap:3px;align-items:center">
        ${i>0?`<button class="btn-icon" onclick="moveRoutineEx(${i},-1)" title="Move up">↑</button>`:'<div style="width:30px"></div>'}
        ${i<routine.length-1?`<button class="btn-icon" onclick="moveRoutineEx(${i},1)" title="Move down">↓</button>`:'<div style="width:30px"></div>'}
        <button class="btn-icon red" onclick="removeRoutineEx(${i})">✕</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="screen-inner">
    <div class="page-hdr">
      <div class="page-title">⚙️ Settings</div>
    </div>

    <div class="section-title">Default Routine ${isModified?'<span style="color:#6366f1;font-size:.7rem">(edited)</span>':''}</div>
    ${routineHTML}
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="openAddExModal('routine')">＋ Add Exercise</button>
      ${isModified?`<button class="btn btn-ghost btn-sm" onclick="resetRoutine()">Reset to Default</button>`:''}
    </div>

    <div class="section-title" style="margin-top:16px">Data</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="exportData()">📤 Export Workout Data</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-input').click()">📥 Import Workout Data</button>
      <input id="import-input" type="file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-danger btn-sm" onclick="openModal('clear-modal')">🗑️ Clear All Data</button>
    </div>

    <div class="section-title" style="margin-top:16px">About</div>
    <div class="card-sm" style="font-size:.82rem;color:#64748b;line-height:1.7">
      <div>Progressive overload: weight increases after ${OVERLOAD_SESSIONS} sessions with ALL sets strictly over target reps.</div>
      <div style="margin-top:6px">Minimum increment: 5 lbs per lift.</div>
      <div style="margin-top:6px">Rest timer: ${REST_SEC} seconds after each set.</div>
      <div style="margin-top:6px;color:#475569">${S.sessions.length} sessions recorded · ${lsOk()?'✓ Syncing to device':'⚠ Storage unavailable'}</div>
    </div>
  </div>`;
}

function moveRoutineEx(idx, dir) {
  const routine = [...getCurrentRoutine()];
  const ni = idx + dir;
  if (ni < 0 || ni >= routine.length) return;
  [routine[idx], routine[ni]] = [routine[ni], routine[idx]];
  S.customRoutines.default = routine;
  persist();
  render();
}

function removeRoutineEx(idx) {
  const routine = [...getCurrentRoutine()];
  if (routine.length <= 1) { showToast('Need at least 1 exercise'); return; }
  routine.splice(idx, 1);
  S.customRoutines.default = routine;
  persist();
  render();
}

function resetRoutine() {
  delete S.customRoutines.default;
  persist();
  render();
  showToast('Routine reset to default');
}

function exportData() {
  const data = JSON.stringify({v:2, sessions:S.sessions, customRoutines:S.customRoutines, exported:new Date().toISOString()}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `barbell-coach-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported!');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d || !d.sessions) { showToast('Invalid file'); return; }
      if (confirm(`Import ${d.sessions.length} sessions? Current data will be replaced.`)) {
        S.sessions = d.sessions;
        if (d.customRoutines) S.customRoutines = d.customRoutines;
        persist();
        render();
        showToast('Data imported!');
      }
    } catch(err) { showToast('Error reading file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function doClearData() {
  S.sessions = JSON.parse(JSON.stringify(SEED_SESSIONS));
  S.customRoutines = {};
  persist();
  closeModal('clear-modal');
  render();
  showToast('Data cleared — seed sessions restored');
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function renderModals() {
  return `
    <!-- Delete Session -->
    <div id="del-sess-modal" class="modal-bg">
      <div class="modal">
        <h3>Delete Session?</h3>
        <p>This session will be permanently removed.</p>
        <div class="modal-btns">
          <button class="btn btn-ghost" onclick="closeModal('del-sess-modal')">Cancel</button>
          <button class="btn btn-danger" onclick="doDeleteSession()">Delete</button>
        </div>
      </div>
    </div>

    <!-- Delete Exercise from Workout -->
    <div id="del-ex-modal" class="modal-bg">
      <div class="modal">
        <h3>Remove Exercise?</h3>
        <p></p>
        <div class="modal-btns">
          <button class="btn btn-ghost" onclick="closeModal('del-ex-modal')">Cancel</button>
          <button class="btn btn-danger" onclick="doDeleteEx()">Remove</button>
        </div>
      </div>
    </div>

    <!-- Add Exercise Picker -->
    <div id="add-ex-modal" class="modal-bg add-ex-modal">
      <div class="modal">
        <h3>Add Exercise</h3>
        <div class="ex-picker-list"></div>
        <button class="btn btn-ghost btn-block" onclick="closeModal('add-ex-modal')">Cancel</button>
      </div>
    </div>

    <!-- Discard Workout -->
    <div id="discard-modal" class="modal-bg">
      <div class="modal">
        <h3>Discard Workout?</h3>
        <p>All progress in this session will be lost.</p>
        <div class="modal-btns">
          <button class="btn btn-ghost" onclick="closeModal('discard-modal')">Keep Going</button>
          <button class="btn btn-danger" onclick="doDiscardWorkout()">Discard</button>
        </div>
      </div>
    </div>

    <!-- Clear All Data -->
    <div id="clear-modal" class="modal-bg">
      <div class="modal">
        <h3>Clear All Data?</h3>
        <p>All saved sessions will be removed and seed data restored. This cannot be undone.</p>
        <div class="modal-btns">
          <button class="btn btn-ghost" onclick="closeModal('clear-modal')">Cancel</button>
          <button class="btn btn-danger" onclick="doClearData()">Clear All</button>
        </div>
      </div>
    </div>
  `;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadFromStorage();
render();
</script>
</body>
</html>
