<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Barbell Coach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--text:#f1f5f9;--muted:#94a3b8;--accent:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:70px}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input{font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text)}
input:focus{outline:2px solid var(--accent)}
.card{background:var(--surface);border-radius:12px;padding:16px;margin:8px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;font-size:10px;color:var(--muted);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.header{padding:16px 12px 4px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:700}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px}
.ex-card{background:var(--surface);border-radius:12px;margin:6px 12px;overflow:hidden}
.ex-header{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.ex-icon{font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.ex-info{flex:1;min-width:0}
.ex-name{font-weight:700;font-size:15px}
.ex-muscles{font-size:11px;color:var(--muted)}
.ex-body{padding:0 12px 12px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 80px;gap:6px;align-items:center;margin-bottom:6px}
.set-num{text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.set-input{width:100%;text-align:center;padding:8px 4px}
.set-done{display:flex;gap:4px}
.set-done button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;background:var(--surface2)}
.set-done button.done{background:var(--green);color:#000}
.pr-badge{background:var(--yellow);color:#000;border-radius:4px;font-size:10px;font-weight:700;padding:1px 4px;margin-left:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:340px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.timer-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.timer-ring{position:relative;width:44px;height:44px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sparkline{height:40px;width:100%}
.progress-ex{background:var(--surface);border-radius:12px;margin:6px 12px;overflow:hidden}
.progress-header{padding:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.progress-body{padding:0 12px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface2)}
.mg-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.mg-row:last-child{border-bottom:none}
.mg-bar-bg{flex:1;background:var(--surface2);border-radius:4px;height:6px;overflow:hidden}
.mg-bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.toggle{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.toggle button{flex:1;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.toggle button.active{background:var(--surface);color:var(--text)}
.hist-session{background:var(--surface);border-radius:12px;margin:6px 12px;overflow:hidden}
.hist-header{padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.hist-body{padding:0 12px 12px}
.cur-weight-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.cur-weight-row:last-child{border-bottom:none}
.suggestion-box{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;color:var(--muted)}
.suggestion-box strong{color:var(--text)}
.elapsed{font-size:12px;color:var(--muted)}
.routine-item{display:flex;align-items:center;gap:8px;padding:10px;background:var(--surface2);border-radius:8px;margin-bottom:6px}
.routine-item input{width:50px;text-align:center;padding:4px}
.stat-row{display:flex;gap:8px;margin:4px 12px}
.stat-box{flex:1;background:var(--surface);border-radius:10px;padding:12px;text-align:center}
.stat-box .val{font-size:22px;font-weight:700}
.stat-box .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px}
.note-input{width:100%;margin:0 0 8px;padding:6px 10px;font-size:13px}
.note-text{font-size:12px;color:var(--muted);margin:-2px 0 6px 34px}
.swap-panel{background:var(--surface2);border-radius:8px;padding:8px;margin-top:8px}
@media(prefers-color-scheme:dark){body{color:var(--text)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Constants ──────────────────────────────────────────────────────────────
const APP_VERSION = 4;          // routine/data migration version
const REST_SEC = 60;            // default rest for accessories
const OVERLOAD_SESSIONS = 2;    // qualifying sessions needed AT THE CURRENT WEIGHT before increasing
const LOOK_BACK = 5;
const STALL_SESSIONS = 3;       // misses in a row at the same weight before an automatic reset
const RESET_PCT = 0.10;         // reset drops the weight ~10% (rounded to 5 lb)

const EXERCISE_CFG = {
  'Barbell Bench Press':         {icon:'🏋️',cat:'upper',inc:5,color:'#ef4444',muscles:'Chest'},
  'Incline Barbell Bench Press': {icon:'📈',cat:'upper',inc:5,color:'#fb923c',muscles:'Chest · Upper Chest'},
  'Close Grip Bench Press':      {icon:'💎',cat:'upper',inc:5,color:'#f97316',muscles:'Chest · Triceps'},

  'Barbell Bicep Curl':          {icon:'💪',cat:'upper',inc:5,color:'#a855f7',muscles:'Biceps'},

  'Barbell Bent Over Row':       {icon:'🔄',cat:'upper',inc:5,color:'#06b6d4',muscles:'Back · Biceps'},
  'Barbell Shrug':               {icon:'🤷',cat:'upper',inc:5,color:'#38bdf8',muscles:'Traps'},
  'Lat Pulldown':                {icon:'🎯',cat:'upper',inc:5,color:'#0ea5e9',muscles:'Lats · Biceps'},
  'Pullup':                      {icon:'🔝',cat:'upper',inc:0,color:'#2dd4bf',muscles:'Lats · Biceps'},
  'Barbell Upright Row':         {icon:'↕️',cat:'upper',inc:5,color:'#60a5fa',muscles:'Shoulders · Traps'},
  'Barbell Back Squat':          {icon:'🦵',cat:'lower',inc:5,color:'#22c55e',muscles:'Quads · Glutes'},
  'Romanian Deadlift':           {icon:'🔻',cat:'lower',inc:5,color:'#facc15',muscles:'Hamstrings · Glutes'},
  'Barbell Hip Thrust':          {icon:'🍑',cat:'lower',inc:5,color:'#f472b6',muscles:'Glutes'},
  'Barbell Deadlift':            {icon:'⚡',cat:'lower',inc:5,color:'#4ade80',muscles:'Back · Hamstrings'},

  'Barbell Lunges':              {icon:'🚶',cat:'lower',inc:5,color:'#86efac',muscles:'Quads · Glutes'},
  'Barbell Front Squat':         {icon:'🏅',cat:'lower',inc:5,color:'#34d399',muscles:'Quads · Core'},
  'Barbell Sumo Deadlift':       {icon:'🏆',cat:'lower',inc:5,color:'#fde68a',muscles:'Glutes · Hamstrings'},
  'Core':                        {icon:'⭕',cat:'core', inc:0, color:'#818cf8',muscles:'Core · Hip Flexors'},
  'Plank':                       {icon:'🧱',cat:'core', inc:0, color:'#6366f1',muscles:'Core'},
  // ── v3 additions (back-friendly) ──
  'Face Pull':                   {icon:'🎯',cat:'daily',inc:5,color:'#14b8a6',muscles:'Rear Delts · Upper Back',rest:60},
  'Chest-Supported Row':         {icon:'🛡️',cat:'upper',inc:5,color:'#0891b2',muscles:'Upper Back · Lats (DB per hand)'},
  'Goblet Squat':                {icon:'🏺',cat:'lower',inc:5,color:'#10b981',muscles:'Quads · Glutes (no bar on back)'},
  'Bulgarian Split Squat':       {icon:'🦿',cat:'lower',inc:5,color:'#059669',muscles:'Quads · Glutes (DB per hand)'},
  'Dumbbell Lateral Raise':      {icon:'🪽',cat:'upper',inc:5,color:'#8b5cf6',muscles:'Side Delts (DB per hand)'},
};

// Add-reps-before-weight ("double progression") for lifts where a 5 lb jump is a big %.
// Work up to the top of the range on every set, then add 5 lb and start back at the bottom.
const REP_RANGES = {
  'Barbell Overhead Press':[8,10],
  'Barbell Bicep Curl':[10,12],
  'Barbell Skull Crushers':[10,12],
  'Face Pull':[15,20],
  'Dumbbell Lateral Raise':[12,15],
};

// Rest by exercise (seconds). Heavy compounds get longer rest; everything else uses REST_SEC.
const REST_LONG = 120, REST_MED = 90;
['Barbell Back Squat','Barbell Front Squat','Barbell Bench Press','Barbell Bent Over Row','Romanian Deadlift',
 'Barbell Deadlift','Barbell Sumo Deadlift','Barbell Overhead Press'].forEach(n=>{EXERCISE_CFG[n].rest=REST_LONG;});
['Incline Barbell Bench Press','Close Grip Bench Press','Barbell Hip Thrust','Lat Pulldown','Chest-Supported Row',
 'Goblet Squat','Bulgarian Split Squat','Barbell Lunges','Barbell Good Morning','Pullup'].forEach(n=>{EXERCISE_CFG[n].rest=REST_MED;});
function restFor(name){return EXERCISE_CFG[name]?.rest||REST_SEC;}

// Starting weights for exercises with no history (estimated from current lifts as of 11/3)
const STARTING_WEIGHTS = {
  'Face Pull':30,                  // cable stack, light — posture work, not a strength lift
  'Chest-Supported Row':45,        // per hand, incline bench face-down
  'Goblet Squat':60,               // one DB held at chest
  'Bulgarian Split Squat':30,      // per hand
  'Dumbbell Lateral Raise':15,     // per hand — strict, no swinging
  'Barbell Front Squat':155,       // ~70% of 230 back squat
  'Barbell Lunges':95,
  'Barbell Deadlift':225,
  'Barbell Sumo Deadlift':225,
  'Barbell Good Morning':95,
  'Barbell Shrug':185,
  'Barbell Upright Row':75,
  'Pullup':0,
  'Plank':0,
};

// Swap options shown in a workout (same movement pattern)
const ALTERNATIVES = {
  'Barbell Back Squat':['Goblet Squat','Bulgarian Split Squat','Barbell Front Squat','Barbell Lunges'],
  'Barbell Bent Over Row':['Chest-Supported Row'],
  'Chest-Supported Row':['Barbell Bent Over Row'],
  'Barbell Bench Press':['Close Grip Bench Press','Incline Barbell Bench Press'],
  'Incline Barbell Bench Press':['Barbell Bench Press'],
  'Romanian Deadlift':['Barbell Hip Thrust','Barbell Good Morning'],
  'Lat Pulldown':['Pullup'],
  'Barbell Skull Crushers':['Close Grip Bench Press'],
};

// v4 order: legs / push / pull alternate, and the three spine-loading lifts
// (Squat, Barbell Row, RDL) sit 4 slots apart so a session rarely gets more than two.
const DEFAULT_ROUTINE = [
  {name:'Barbell Back Squat',          sets:3, targetReps:8},     // legs (spine)
  {name:'Barbell Bench Press',         sets:3, targetReps:8},     // push
  {name:'Lat Pulldown',                sets:3, targetReps:8},     // pull
  {name:'Barbell Overhead Press',      sets:3, targetReps:'8-10'},// push
  {name:'Barbell Bent Over Row',       sets:3, targetReps:8},     // pull (spine)
  {name:'Barbell Hip Thrust',          sets:3, targetReps:10},    // legs
  {name:'Incline Barbell Bench Press', sets:3, targetReps:8},     // push
  {name:'Chest-Supported Row',         sets:3, targetReps:10},    // pull
  {name:'Romanian Deadlift',           sets:3, targetReps:10},    // legs (spine)
  {name:'Barbell Skull Crushers',      sets:3, targetReps:'10-12'},// push (arms)
  {name:'Barbell Bicep Curl',          sets:2, targetReps:'10-12'},// pull (arms)
  {name:'Dumbbell Lateral Raise',      sets:2, targetReps:'12-15'},// side delts
  {name:'Core',                        sets:3, targetReps:'8-10'},  // every session
  {name:'Face Pull',                   sets:3, targetReps:'15-20'}, // every session
];
// v3 rotation order (non-core), used to keep your place in the rotation when upgrading
const V3_ORDER=['Barbell Back Squat','Barbell Bench Press','Incline Barbell Bench Press','Barbell Overhead Press',
  'Romanian Deadlift','Barbell Hip Thrust','Lat Pulldown','Barbell Bent Over Row','Chest-Supported Row',
  'Barbell Skull Crushers','Barbell Bicep Curl'];

// v4: reorder a custom routine that has the standard lifts, add lateral raises, set rep ranges
function migrateRoutineV4(r){
  if(!Array.isArray(r)||!r.length) return r;
  const order=DEFAULT_ROUTINE.map(x=>x.name);
  const names=new Set(r.map(x=>x.name));
  if(!names.has('Dumbbell Lateral Raise')) r=[...r,{name:'Dumbbell Lateral Raise',sets:2,targetReps:'12-15'}];
  r=r.map(x=>REP_RANGES[x.name]?{...x,targetReps:REP_RANGES[x.name].join('-')}:x);
  const known=r.filter(x=>order.includes(x.name)).sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));
  const extra=r.filter(x=>!order.includes(x.name)); // your own additions stay, after the standard lifts
  const core=known.filter(x=>isCore(x.name)), lifts=known.filter(x=>!isCore(x.name));
  return [...lifts,...extra.filter(x=>!isCore(x.name)),...core,...extra.filter(x=>isCore(x.name))];
}
// Keep "what's next" the same when the rotation order changes
function remapPointer(oldNames,newNames,ptr){
  if(!oldNames.length||!newNames.length) return ptr;
  const p=(ptr??-1);
  for(let k=1;k<=oldNames.length;k++){
    const next=oldNames[(p+k+oldNames.length)%oldNames.length];
    const idx=newNames.indexOf(next);
    if(idx!==-1) return (idx-1+newNames.length)%newNames.length;
  }
  return ptr;
}

// Upgrade a saved/imported custom routine to v3 (keeps positions so the rotation pointer stays valid)
function migrateRoutine(r){
  if(!Array.isArray(r)||!r.length) return r;
  r=r.map(x=>x.name==='Close Grip Bench Press'?{name:'Chest-Supported Row',sets:3,targetReps:10}:x);
  if(!r.some(x=>x.name==='Face Pull')) r.push({name:'Face Pull',sets:3,targetReps:15});
  return r;
}

// Make sessions from any export (this app, or the older Monday/Friday app) usable
function normalizeSessions(list){
  if(!Array.isArray(list)) return [];
  const seen=new Set(), out=[];
  list.forEach(s=>{
    if(!s||!s.date||!Array.isArray(s.exercises)) return;
    const id=s.id||('s'+Date.parse(s.date)+Math.random().toString(36).slice(2,6));
    if(seen.has(id)) return; seen.add(id);
    out.push({...s,id,notes:s.notes||'',exercises:s.exercises.map(e=>({
      ...e,
      targetSets:e.targetSets||(e.sets||[]).length||3,
      targetReps:e.targetReps??8,
      sets:(e.sets||[]).map(st=>({w:Number(st.w)||0,r:Number(st.r)||0,n:st.n||'',
        done:st.done===undefined?(Number(st.r)>0):!!st.done,isPR:!!st.isPR})),
    }))});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.startTime||0)-(b.startTime||0));
}

const MUSCLE_GROUP_MAP = {
  'Chest':      ['Barbell Bench Press','Incline Barbell Bench Press','Close Grip Bench Press'],
  'Back':       ['Barbell Bent Over Row','Chest-Supported Row','Lat Pulldown','Pullup','Barbell Deadlift','Barbell Sumo Deadlift'],
  'Upper Back': ['Face Pull','Chest-Supported Row','Barbell Bent Over Row','Barbell Shrug'],
  'Shoulders':  ['Barbell Overhead Press','Barbell Upright Row','Dumbbell Lateral Raise'],
  'Triceps':    ['Barbell Skull Crushers','Close Grip Bench Press'],
  'Biceps':     ['Barbell Bicep Curl','Barbell Bent Over Row','Chest-Supported Row','Lat Pulldown','Pullup'],
  'Quads':      ['Barbell Back Squat','Barbell Front Squat','Barbell Lunges','Goblet Squat','Bulgarian Split Squat'],
  'Hamstrings': ['Romanian Deadlift','Barbell Good Morning','Barbell Deadlift','Barbell Sumo Deadlift'],
  'Glutes':     ['Barbell Hip Thrust','Barbell Back Squat','Romanian Deadlift','Barbell Lunges','Barbell Sumo Deadlift','Goblet Squat','Bulgarian Split Squat'],
  'Core':       ['Core','Plank'],
};

// Helper to build a set
function mk(w,r,n,done,isPR){return {w,r:r,n:n||'',done:done!==false,isPR:isPR||false};}
// Helper to build an exercise entry for seed
function ex(name,tSets,tReps,sets){
  const cfg=EXERCISE_CFG[name]||{};
  return {name,targetSets:tSets,targetReps:tReps,sets,suggestion:{},missedLast:false};
}

const SEED_SESSIONS = [

    ex('Close Grip Bench Press',2,10,[mk(115,10),mk(115,10)]),

    ex('Close Grip Bench Press',2,10,[mk(120,7),mk(110,9)]),

    ex('Barbell Overhead Press',3,8,[mk(110,8),mk(110,10),mk(120,10)]),

  ]},
  {id:'h5',date:'2026-08-05',type:'default',label:'Full Body',notes:'',exercises:[
    ex('Barbell Bench Press',3,8,[mk(130,8),mk(130,8),mk(130,6)]),
    ex('Close Grip Bench Press',2,10,[mk(90,10),mk(90,10)]),
    ex('Barbell Bicep Curl',2,10,[mk(60,10),mk(60,10)]),
    ex('Barbell Overhead Press',3,8,[mk(120,8),mk(120,8),mk(120,7)]),

    ex('Barbell Back Squat',3,8,[mk(150,8),mk(140,8),mk(140,8)]),
    ex('Romanian Deadlift',2,10,[mk(140,10),mk(140,10)]),
    ex('Core',3,'8-10',[mk(0,10),mk(0,10),mk(0,10)]),
  ]},
  {id:'h6',date:'2026-08-08',type:'default',label:'Full Body',notes:'',exercises:[
    ex('Barbell Bench Press',3,8,[mk(135,8),mk(145,8),mk(145,9)]),

// Apply v3 routine changes to a saved/imported custom routine (once)
function applyMigrations(fromVersion){
  const v=fromVersion||2;
  if(v<3 && S.customRoutines?.default){
    S.customRoutines.default=migrateRoutine(S.customRoutines.default);
  }
  if(v<4){
    const oldNonCore=(S.customRoutines?.default?.length?S.customRoutines.default.filter(x=>!isCore(x.name)).map(x=>x.name):V3_ORDER);
    if(S.customRoutines?.default?.length) S.customRoutines.default=migrateRoutineV4(S.customRoutines.default);
    const newNonCore=getCurrentRoutine().filter(x=>!isCore(x.name)).map(x=>x.name);
    S.routinePointer=remapPointer(oldNonCore,newNonCore,S.routinePointer);
  }
  S.routineVersion=APP_VERSION;
}
// Fresh install: seed history ends 11/3 after Lat Pulldown, so the next lift is Barbell Bent Over Row
function initialPointer(){
  const nc=DEFAULT_ROUTINE.filter(x=>!isCore(x.name)).map(x=>x.name);
  return (nc.indexOf('Barbell Bent Over Row')-1+nc.length)%nc.length;
}

function lsOk(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}

function persist(){
  if(!lsOk()) return;
  localStorage.setItem('barbell-coach-v2',JSON.stringify({
    sessions:S.sessions,
    customRoutines:S.customRoutines,
    routinePointer:S.routinePointer,
    routineVersion:S.routineVersion,
  }));
}

function load(){
  if(!lsOk()) return;
  try{
    const raw=localStorage.getItem('barbell-coach-v2');
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d.sessions) S.sessions=normalizeSessions(d.sessions);
    if(d.customRoutines) S.customRoutines=d.customRoutines;
    if(d.routinePointer!==undefined) S.routinePointer=d.routinePointer;
    applyMigrations(d.routineVersion);
    persist();
  }catch(e){}
}

// ── Helpers ────────────────────────────────────────────────────────────────
// "Always" exercises (Core + Face Pull) are done every session and sit outside the rotation
function isCore(name){const c=EXERCISE_CFG[name]?.cat;return c==='core'||c==='daily';}
function isCoreOnly(name){return EXERCISE_CFG[name]?.cat==='core';}

function getCurrentRoutine(){
  const cr=S.customRoutines?.default;
  return (cr && cr.length>0)?cr:DEFAULT_ROUTINE;
}

function epley(w,r){return r>1?Math.round(w*(1+r/30)):w;}

function getSuggestion(name){
  const cfg=EXERCISE_CFG[name]||{};
  const routine=getCurrentRoutine().find(r=>r.name===name);
  const range=REP_RANGES[name];
  const target=range?range[0]:(parseInt(routine?.targetReps)||8);
  const hist=S.sessions.map(s=>{
    const ex=s.exercises?.find(e=>e.name===name);
    if(!ex) return null;
    const doneSets=ex.sets.filter(st=>st.done&&st.r>0);
    if(!doneSets.length) return null;
    const maxW=Math.max(...doneSets.map(st=>st.w));
    const atMax=doneSets.filter(st=>st.w===maxW).map(st=>st.r);
    const tSets=ex.targetSets||doneSets.length;
    const full=atMax.length>=tSets;            // every planned set done at the top weight
    const minReps=Math.min(...atMax);
    return {w:maxW,minReps,full,date:s.date};
  }).filter(Boolean);

  if(!hist.length){
    const sw=STARTING_WEIGHTS[name];
    const reps=range?range[0]:target;
    if(sw!==undefined) return {weight:sw,reps,note:sw?`Starting estimate — adjust if it feels too easy/hard`:'Bodyweight / reps focus'};
    return {weight:0,reps:'',note:'No history'};
  }
  const last=hist[hist.length-1];
  const inc=cfg.inc||0;
  if(!inc) return {weight:last.w,reps:target,note:'Bodyweight / reps focus'};

  // Sessions in a row (most recent backwards) at the current weight
  const streak=[];
  for(let i=hist.length-1;i>=0&&hist[i].w===last.w;i--) streak.unshift(hist[i]);
  const meetsMin=h=>h.full&&h.minReps>=target;      // hit the minimum on every set
  const lastN=streak.slice(-STALL_SESSIONS);
  const stalled=lastN.length>=STALL_SESSIONS&&lastN.every(h=>!meetsMin(h));
  const resetW=Math.max(inc,Math.round(last.w*(1-RESET_PCT)/5)*5);

  if(range){
    const [lo,hi]=range;
    if(last.full&&last.minReps>=hi)
      return {weight:last.w+inc,reps:lo,note:`Increase! Hit ${hi}+ on every set at ${last.w}lb — start back at ${lo} reps`};
    if(stalled)
      return {weight:resetW,reps:lo,note:`Reset: ${STALL_SESSIONS} sessions in a row under ${lo} reps at ${last.w}lb. Build back up from ${resetW}lb.`};
    const aim=Math.min(hi,Math.max(lo,(last.full?last.minReps:lo)+1));
    return {weight:last.w,reps:aim,note:`Stay at ${last.w}lb — aim for ${aim} reps per set. Add 5 lb once every set hits ${hi}.`};
  }

  const qualCount=streak.slice(-LOOK_BACK).filter(meetsMin).length;
  if(qualCount>=OVERLOAD_SESSIONS)
    return {weight:last.w+inc,reps:target,note:`Increase! Hit all reps ${qualCount}× at ${last.w}lb`};
  if(stalled)
    return {weight:resetW,reps:target,note:`Reset: ${STALL_SESSIONS} sessions in a row missing reps at ${last.w}lb. Build back up from ${resetW}lb.`};
  const need=OVERLOAD_SESSIONS-qualCount;
  return {weight:last.w,reps:target,note:`Stay at ${last.w}lb — ${qualCount}/${OVERLOAD_SESSIONS} sessions with all reps (${need} more to go up). Leave 1–2 reps in the tank.`};
}

function getWeekSessions(){
  const now=new Date();
  const mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  mon.setHours(0,0,0,0);
  return S.sessions.filter(s=>new Date(s.date)>=mon);
}

function getMuscleGroupsThisWeek(){
  const weekSes=getWeekSessions();
  const counts={};
  Object.keys(MUSCLE_GROUP_MAP).forEach(mg=>{counts[mg]=0;});
  weekSes.forEach(ses=>{
    ses.exercises?.forEach(ex=>{
      Object.entries(MUSCLE_GROUP_MAP).forEach(([mg,exes])=>{
        if(exes.includes(ex.name)&&ex.sets?.some(st=>st.done&&st.r>0)) counts[mg]++;
      });
    });
  });
  return counts;
}

function fmtDate(d){
  const dt=new Date(d+'T12:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function escHtml(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(t){return escHtml(t);}

function fmtSec(s){const m=Math.floor(s/60),r=s%60;return `${m}:${r.toString().padStart(2,'0')}`;}

// ── Workout Logic ──────────────────────────────────────────────────────────
function startWorkout(){
  const routine=getCurrentRoutine();
  const nonCore=routine.filter(item=>!isCore(item.name));
  const core=routine.filter(item=>isCore(item.name));
  const pointer=S.routinePointer??-1;
  const startIdx=(pointer+1)%nonCore.length;
  const rotated=[...nonCore.slice(startIdx),...nonCore.slice(0,startIdx)];
  const sortedRoutine=[...core,...rotated];
  const exercises=sortedRoutine.map(item=>{
    const sug=getSuggestion(item.name);
    const w=sug.weight||0;
    const sets=[];
    for(let i=0;i<item.sets;i++){sets.push({w,r:0,n:'',done:false,isPR:false});}
    return {name:item.name,targetSets:item.sets,targetReps:item.targetReps,sets,suggestion:sug,missedLast:false};
  });
  S.wkSession={
    id:'s'+Date.now()+Math.random().toString(36).slice(2,6),
    date:new Date().toISOString().slice(0,10),
    type:'default',label:'Full Body',notes:'',
    startTime:Date.now(),exercises
  };
  S.wkStart=Date.now();
  S.wkPhase='active';
  S.exOpen={};
  exercises.forEach(e=>{S.exOpen[e.name]=true;});
  if(S.elapsedInterval) clearInterval(S.elapsedInterval);
  S.elapsedInterval=setInterval(()=>{
    const el=document.getElementById('elapsed');
    if(el) el.textContent=fmtSec(Math.floor((Date.now()-S.wkStart)/1000));
  },1000);
  render();
}

function finishWorkout(){
  if(!S.wkSession) return;
  // update PR flags
  S.wkSession.exercises.forEach(ex=>{
    ex.sets.forEach(set=>{
      if(!set.done||!set.r) return;
      const prev=S.sessions.flatMap(s=>s.exercises?.filter(e=>e.name===ex.name)||[])
        .flatMap(e=>e.sets||[]).filter(st=>st.done&&st.r>0);
      const cur1rm=epley(set.w,set.r);
      const best=Math.max(0,...prev.map(st=>epley(st.w,st.r)));
      set.isPR=cur1rm>best;
    });
  });
  // update routinePointer
  const routine=getCurrentRoutine();
  const nonCore=routine.filter(r=>!isCore(r.name));
  const sessionNonCore=(S.wkSession.exercises||[]).filter(e=>!isCore(e.name));
  for(let i=sessionNonCore.length-1;i>=0;i--){
    const idx=nonCore.findIndex(r=>r.name===sessionNonCore[i].name);
    if(idx!==-1){S.routinePointer=idx;break;}
  }
  S.sessions.push(JSON.parse(JSON.stringify(S.wkSession)));
  S.wkPhase='idle';
  S.wkSession=null;
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
  if(S.elapsedInterval){clearInterval(S.elapsedInterval);S.elapsedInterval=null;}
  persist();
  render();
}

function cancelWorkout(){
  S.wkPhase='idle';
  S.wkSession=null;
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
  if(S.elapsedInterval){clearInterval(S.elapsedInterval);S.elapsedInterval=null;}
  render();
}

function startTimer(exName){
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
  S.timerActive=true;
  S.timerSec=restFor(exName);
  S.timerTotal=restFor(exName);
  S.timerEx=exName;
  S.timerInterval=setInterval(()=>{
    S.timerSec--;
    if(S.timerSec<=0){
      S.timerSec=0;
      S.timerActive=false;
      clearInterval(S.timerInterval);
      S.timerInterval=null;
    }
    renderTimerBar();
  },1000);
  renderTimerBar();
}

function renderTimerBar(){
  const bar=document.getElementById('timerBar');
  if(!bar) return;
  if(!S.timerActive&&S.timerSec===0){bar.style.display='none';return;}
  bar.style.display='flex';
  const pct=(S.timerSec/S.timerTotal)*100;
  const circ=2*Math.PI*18;
  const offset=circ*(1-pct/100);
  bar.innerHTML=`
    <div class="timer-ring">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="18" fill="none" stroke="var(--surface2)" stroke-width="4"/>
        <circle cx="22" cy="22" r="18" fill="none" stroke="${S.timerSec<=10?'var(--red)':'var(--accent)'}" stroke-width="4"
          stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="timer-ring-num">${fmtSec(S.timerSec)}</div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13px">Rest Timer</div>
      <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${S.timerEx}</div>
    </div>
    <button class="btn btn-sm btn-ghost" onclick="skipTimer()">Skip</button>
  `;
}

function skipTimer(){
  S.timerSec=0;S.timerActive=false;
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
  renderTimerBar();
}

      if(inWorkout){
        html+=`<div class="set-row">
          <div class="set-num">${si+1}</div>
          <input type="number" class="set-input" value="${set.w||''}" placeholder="0" onchange="setVal(${ei},${si},'w',this.value)" inputmode="decimal">
          <input type="number" class="set-input" value="${set.r||''}" placeholder="0" onchange="setVal(${ei},${si},'r',this.value)" inputmode="decimal">
          <div class="set-done">
            <button class="${set.done?'done':''}" onclick="toggleSetDone(${ei},${si})">${set.done?'✓':'○'}</button>
          </div>
        </div>`;
        if(notesOn) html+=`<input type="text" class="note-input" value="${escAttr(set.n)}" placeholder="Set ${si+1} note (e.g. back tight, felt easy)" onchange="setVal(${ei},${si},'n',this.value)">`;
      } else {
        html+=`<div class="set-row">
          <div class="set-num">${si+1}${pr}</div>
          <div style="text-align:center;font-size:14px">${set.w?set.w+'lb':'—'}</div>
          <div style="text-align:center;font-size:14px">${set.r||'—'}</div>
          <div style="text-align:center">${set.done?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--muted)">—</span>'}</div>
        </div>`;
        if(set.n) html+=`<div class="note-text">📝 ${escHtml(set.n)}</div>`;
      }
    });
    if(inWorkout){
      const alts=(ALTERNATIVES[exItem.name]||[]).filter(n=>EXERCISE_CFG[n]);
      html+=`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="addSet(${ei})">+ Set</button>
        ${exItem.sets.length>1?`<button class="btn btn-ghost btn-sm" onclick="removeSet(${ei})">- Set</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="toggleNotes(${ei})">📝${notesOn?' Hide':''} Notes</button>
        ${alts.length?`<button class="btn btn-ghost btn-sm" onclick="toggleSwap(${ei})">⇄ Swap</button>`:''}
        <button class="btn btn-sm" style="background:var(--surface2);margin-left:auto;color:var(--red)" onclick="removeExFromWorkout(${ei})">Remove</button>
      </div>`;
      if(S.swapOpen===ei&&alts.length){
        html+=`<div class="swap-panel"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Swap for today only:</div>`;
        alts.forEach(n=>{
          const sg=getSuggestion(n);
          html+=`<button class="btn btn-ghost btn-sm" style="width:100%;justify-content:space-between;margin-bottom:4px" onclick="swapEx(${ei},'${n}')"><span>${EXERCISE_CFG[n].icon} ${n}</span><span style="color:var(--accent)">${sg.weight?sg.weight+'lb':'BW'}</span></button>`;
        });
        html+=`</div>`;
      }
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}

function renderHistory(){
  let html=`<div class="header"><h1>📅 History</h1></div>`;
  const sorted=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){html+=`<div class="empty">No sessions yet</div>`;return html;}
  sorted.forEach(ses=>{
    const open=S.histOpen[ses.id];
    const vol=ses.exercises?.reduce((acc,ex)=>acc+ex.sets.filter(s=>s.done&&s.r>0).reduce((a,s)=>a+s.w*s.r,0),0)||0;
    const prs=ses.exercises?.reduce((acc,ex)=>acc+ex.sets.filter(s=>s.isPR).length,0)||0;
    html+=`<div class="hist-session">
      <div class="hist-header" onclick="toggleHist('${ses.id}')">
        <div>
          <div style="font-weight:700">${fmtDate(ses.date)}</div>
          <div style="font-size:12px;color:var(--muted)">${ses.exercises?.length||0} exercises · ${vol?Math.round(vol).toLocaleString()+'lb vol':''}${prs?' · ⭐'+prs+' PR':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn btn-sm" style="color:var(--red);background:var(--surface2)" onclick="event.stopPropagation();pendingDelSession('${ses.id}')">🗑</button>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="transform:${open?'rotate(180deg)':'none'}"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>`;
    if(open){
      html+=`<div class="hist-body">`;
      ses.exercises?.forEach((exItem,ei)=>{html+=buildExCard(exItem,ei,false);});
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

function renderProgress(){
  const allNames=[...new Set(S.sessions.flatMap(s=>s.exercises?.map(e=>e.name)||[]))].sort();
  let html=`<div class="header"><h1>📈 Progress</h1></div>`;
  if(!S.progressEx||!allNames.includes(S.progressEx)) S.progressEx=allNames[0]||null;
  html+=`<div style="padding:8px 12px"><select style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px" onchange="S.progressEx=this.value;render()">`;
  allNames.forEach(n=>{html+=`<option value="${n}"${n===S.progressEx?' selected':''}>${n}</option>`;});
  html+=`</select></div>`;
  html+=`<div style="padding:0 12px 8px"><div class="toggle"><button class="${S.progressMetric==='1rm'?'active':''}" onclick="S.progressMetric='1rm';render()">Est. 1RM</button><button class="${S.progressMetric==='vol'?'active':''}" onclick="S.progressMetric='vol';render()">Volume</button><button class="${S.progressMetric==='weight'?'active':''}" onclick="S.progressMetric='weight';render()">Max Weight</button></div></div>`;
  if(S.progressEx){
    const data=S.sessions.filter(s=>s.exercises?.some(e=>e.name===S.progressEx))
      .map(s=>{
        const exItem=s.exercises.find(e=>e.name===S.progressEx);
        const done=exItem.sets.filter(st=>st.done&&st.r>0);
        if(!done.length) return null;
        let val=0;
        if(S.progressMetric==='1rm') val=Math.max(...done.map(st=>epley(st.w,st.r)));
        else if(S.progressMetric==='vol') val=done.reduce((a,st)=>a+st.w*st.r,0);
        else val=Math.max(...done.map(st=>st.w));
        return {date:s.date,val};
      }).filter(Boolean);
    if(data.length){
      const maxVal=Math.max(...data.map(d=>d.val));
      const minVal=Math.min(...data.map(d=>d.val));
      const range=maxVal-minVal||1;
      const W=360,H=80,pad=10;
      const pts=data.map((d,i)=>{
        const x=pad+(i/(Math.max(data.length-1,1)))*(W-pad*2);
        const y=H-pad-(((d.val-minVal)/range)*(H-pad*2));
        return `${x},${y}`;
      });
      const last=data[data.length-1];
      const prev=data[data.length-2];
      const diff=prev?last.val-prev.val:0;
      const cfg=EXERCISE_CFG[S.progressEx]||{};
      html+=`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-size:24px;font-weight:700">${Math.round(last.val)}${S.progressMetric==='vol'?'lb':S.progressMetric==='weight'?'lb':'lb 1RM'}</div>
            <div style="font-size:12px;color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'▲':'▼'} ${Math.abs(Math.round(diff))} from last</div>
          </div>
          <div style="font-size:13px;color:var(--muted)">${data.length} sessions</div>
        </div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
          <polyline points="${pts.join(' ')}" fill="none" stroke="${cfg.color||'var(--accent)'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${data.map((d,i)=>{const[x,y]=pts[i].split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="${cfg.color||'var(--accent)'}"/>`;}).join('')}
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">
          <span>${fmtDate(data[0].date)}</span><span>${fmtDate(last.date)}</span>
        </div>
      </div>`;
      // recent history table
      html+=`<div class="section-title">Recent Sessions</div>`;
      [...data].reverse().slice(0,10).forEach(d=>{
        const bar=Math.round((d.val/maxVal)*100);
        html+=`<div style="padding:6px 12px;display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:var(--muted);width:90px">${fmtDate(d.date)}</span>
          <div class="mg-bar-bg" style="flex:1"><div class="mg-bar-fill" style="width:${bar}%;background:${cfg.color||'var(--accent)'}"></div></div>
          <span style="font-size:13px;font-weight:700;width:60px;text-align:right">${Math.round(d.val)}lb</span>
        </div>`;
      });
    } else {
      html+=`<div class="empty">No data for this exercise</div>`;
    }
  }
  return html;
}

function renderSettings(){
  const routine=getCurrentRoutine();
  const customR=S.customRoutines?.default;
  let html=`<div class="header"><h1>⚙️ Settings</h1><span class="elapsed">v${APP_VERSION}</span></div>`;
  html+=`<div class="section-title">Default Routine (${routine.length} exercises)</div>`;
  html+=`<div class="card">`;
  if(S.settingsRoutineEdit){
    routine.forEach((item,i)=>{
      const cfg=EXERCISE_CFG[item.name]||{};
      html+=`<div class="routine-item">
        <span>${cfg.icon||'🏋️'}</span>
        <span style="flex:1;font-size:13px">${item.name}</span>
        <input type="number" value="${item.sets}" onchange="updateRoutineItem(${i},'sets',this.value)" style="width:44px" inputmode="numeric">
        <span style="font-size:12px;color:var(--muted)">sets</span>
        <input type="text" value="${item.targetReps}" onchange="updateRoutineItem(${i},'targetReps',this.value)" style="width:48px" inputmode="numeric">
        <span style="font-size:12px;color:var(--muted)">reps</span>
        <button onclick="removeRoutineItem(${i})" style="color:var(--red);font-size:16px;padding:4px">✕</button>
      </div>`;
    });
    html+=`<div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="addExercisePrompt('routine')">+ Add Exercise</button>
      <button class="btn btn-green btn-sm" onclick="S.settingsRoutineEdit=false;render()">Done</button>
      ${customR?`<button class="btn btn-sm" style="background:var(--surface2);color:var(--red)" onclick="resetRoutine()">Reset</button>`:''}
    </div>`;
  } else {
    routine.forEach((item,i)=>{
      const cfg=EXERCISE_CFG[item.name]||{};
      html+=`<div class="cur-weight-row">
        <span style="display:flex;align-items:center;gap:6px;font-size:13px">${cfg.icon||''} ${item.name}</span>
        <span style="font-size:12px;color:var(--muted)">${item.sets}×${item.targetReps}</span>
      </div>`;
    });
    html+=`<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="S.settingsRoutineEdit=true;render()">✏️ Edit Routine</button></div>`;
  }
  html+=`</div>`;
  html+=`<div id="addExPanel2" style="display:none"></div>`;
  // Available exercises
  html+=`<div class="section-title">All Available Exercises</div><div class="card">`;
  Object.entries(EXERCISE_CFG).forEach(([name,cfg])=>{
    const sg=getSuggestion(name);
    html+=`<div class="cur-weight-row"><span style="display:flex;align-items:center;gap:6px;font-size:13px">${cfg.icon} ${name} <span style="color:var(--accent);font-weight:700">${sg.weight?sg.weight+'lb':''}</span></span><span class="tag" style="background:${cfg.cat==='upper'?'#3b82f620':cfg.cat==='lower'?'#22c55e20':'#818cf820'};color:${cfg.cat==='upper'?'#3b82f6':cfg.cat==='lower'?'#22c55e':'#818cf8'}">${cfg.muscles}</span></div>`;
  });
  html+=`</div>`;
  // Data
  html+=`<div class="section-title">Data</div><div class="card">
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost" onclick="exportData()">📤 Export JSON</button>
      <label class="btn btn-ghost" style="cursor:pointer">📥 Import JSON<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
      <button class="btn btn-sm" style="background:var(--surface2);color:var(--red)" onclick="confirmClearData()">🗑 Clear All Data</button>
    </div>
  </div>`;
  return html;
}

function renderAddExPanel(target){
  const routine=getCurrentRoutine();
  const inRoutine=routine.map(r=>r.name);
  const all=Object.keys(EXERCISE_CFG).filter(n=>target==='routine'?!inRoutine.includes(n):true);
  const q=(S.addExSearch||'').toLowerCase();
  const filtered=q?all.filter(n=>n.toLowerCase().includes(q)):all;
  let html=`<div class="card" style="margin-top:4px">
    <div style="font-weight:700;margin-bottom:8px">Add Exercise to ${target==='workout'?'Workout':'Routine'}</div>
    <input type="text" placeholder="Search…" value="${S.addExSearch||''}" oninput="S.addExSearch=this.value;refreshAddPanel('${target}')" style="width:100%;margin-bottom:8px">
    <div style="max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">`;
  filtered.forEach(n=>{
    const cfg=EXERCISE_CFG[n];
    html+=`<button class="btn btn-ghost" style="justify-content:flex-start;gap:8px;padding:8px 10px" onclick="addExercise('${n}','${target}')">
      <span>${cfg.icon}</span><span style="flex:1;text-align:left;font-size:13px">${n}</span>
      <span style="font-size:11px;color:var(--muted)">${cfg.muscles}</span>
    </button>`;
  });
  if(!filtered.length) html+=`<div class="empty" style="padding:16px">No exercises found</div>`;
  html+=`</div><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="closeAddPanel('${target}')">Cancel</button></div>`;
  return html;
}

function renderDelSessionModal(){
  return `<div class="modal-overlay"><div class="modal">
    <h3>Delete Session?</h3><p>This action cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="S.pendingDelSession=null;render()">Cancel</button>
      <button class="btn btn-red" onclick="deleteSession(S.pendingDelSession)">Delete</button>
    </div>
  </div></div>`;
}

function renderDelExModal(){
  return `<div class="modal-overlay"><div class="modal">
    <h3>Remove Exercise?</h3><p>Remove "${S.pendingDelEx?.name}" from this workout?</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="S.pendingDelEx=null;render()">Cancel</button>
      <button class="btn btn-red" onclick="doRemoveEx()">Remove</button>
    </div>
  </div></div>`;
}

// ── Event handlers ─────────────────────────────────────────────────────────
function attachEvents(){}

window.setView=function(v){S.view=v;render();}
window.toggleEx=function(name){S.exOpen[name]=!S.exOpen[name];render();}
window.toggleHist=function(id){S.histOpen[id]=!S.histOpen[id];render();}

window.setVal=function(ei,si,field,val){
  if(!S.wkSession) return;
  const set=S.wkSession.exercises[ei].sets[si];
  if(field==='n'){set.n=String(val||'');return;}
  set[field]=field==='r'?parseInt(val)||0:parseFloat(val)||0;
}
window.toggleNotes=function(ei){S.noteOpen[ei]=!S.noteOpen[ei];render();}
window.toggleSwap=function(ei){S.swapOpen=S.swapOpen===ei?null:ei;render();}
window.swapEx=function(ei,newName){
  if(!S.wkSession) return;
  const old=S.wkSession.exercises[ei];
  const sug=getSuggestion(newName);
  const rItem=getCurrentRoutine().find(r=>r.name===newName);
  const tReps=rItem?.targetReps??(['Goblet Squat','Bulgarian Split Squat','Chest-Supported Row'].includes(newName)?10:old.targetReps);
  const nSets=old.sets.length;
  S.wkSession.exercises[ei]={name:newName,targetSets:nSets,targetReps:tReps,
    sets:Array.from({length:nSets},()=>({w:sug.weight||0,r:0,n:'',done:false,isPR:false})),
    suggestion:{...sug,reps:tReps},missedLast:false,swappedFrom:old.name};
  S.exOpen[newName]=true;
  S.swapOpen=null;
  render();
}

window.toggleSetDone=function(ei,si){
  if(!S.wkSession) return;
  const ex=S.wkSession.exercises[ei];
  const set=ex.sets[si];
  set.done=!set.done;
  if(set.done&&set.r>0) startTimer(ex.name);
  render();
}

window.addSet=function(ei){
  if(!S.wkSession) return;
  const ex=S.wkSession.exercises[ei];
  const last=ex.sets[ex.sets.length-1];
  ex.sets.push({w:last?.w||0,r:0,n:'',done:false,isPR:false});
  render();
}

window.removeSet=function(ei){
  if(!S.wkSession) return;
  const ex=S.wkSession.exercises[ei];
  if(ex.sets.length>1) ex.sets.pop();
  render();
}

window.removeExFromWorkout=function(ei){
  S.pendingDelEx={name:S.wkSession.exercises[ei].name,idx:ei};
  render();
}

window.doRemoveEx=function(){
  if(!S.pendingDelEx||!S.wkSession) return;
  S.wkSession.exercises.splice(S.pendingDelEx.idx,1);
  S.pendingDelEx=null;
  render();
}

window.startWorkout=startWorkout;
window.finishWorkout=finishWorkout;
window.cancelWorkout=cancelWorkout;
window.skipTimer=skipTimer;

window.confirmFinish=function(){
  if(confirm('Finish workout?')) finishWorkout();
}
window.confirmCancel=function(){
  if(confirm('Cancel workout? Progress will be lost.')) cancelWorkout();
}

window.pendingDelSession=function(id){S.pendingDelSession=id;render();}
window.deleteSession=function(id){
  S.sessions=S.sessions.filter(s=>s.id!==id);
  S.pendingDelSession=null;
  persist();render();
}

window.addExercisePrompt=function(target){
  S.addExTarget=target;S.addExSearch='';
  const panelId=target==='workout'?'addExPanel':'addExPanel2';
  const panel=document.getElementById(panelId);
  if(panel){panel.style.display='block';panel.innerHTML=renderAddExPanel(target);}
}

window.refreshAddPanel=function(target){
  const panelId=target==='workout'?'addExPanel':'addExPanel2';
  const panel=document.getElementById(panelId);
  if(panel) panel.innerHTML=renderAddExPanel(target);
}

window.closeAddPanel=function(target){
  const panelId=target==='workout'?'addExPanel':'addExPanel2';
  const panel=document.getElementById(panelId);
  if(panel){panel.style.display='none';panel.innerHTML='';}
}

window.addExercise=function(name,target){
  if(target==='workout'){
    if(!S.wkSession) return;
    const sug=getSuggestion(name);
    const routine=getCurrentRoutine();
    const rItem=routine.find(r=>r.name===name)||{sets:3,targetReps:8};
    const sets=[];
    for(let i=0;i<rItem.sets;i++) sets.push({w:sug.weight||0,r:0,n:'',done:false,isPR:false});
    S.wkSession.exercises.push({name,targetSets:rItem.sets,targetReps:rItem.targetReps,sets,suggestion:sug,missedLast:false});
    S.exOpen[name]=true;
  } else {
    if(!S.customRoutines) S.customRoutines={};
    if(!S.customRoutines.default) S.customRoutines.default=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
    S.customRoutines.default.push({name,sets:3,targetReps:8});
    persist();
  }
  S.addExSearch='';
  render();
}

window.updateRoutineItem=function(i,field,val){
  if(!S.customRoutines) S.customRoutines={};
  if(!S.customRoutines.default) S.customRoutines.default=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  S.customRoutines.default[i][field]=field==='sets'?parseInt(val)||1:val;
  persist();
}

window.removeRoutineItem=function(i){
  if(!S.customRoutines) S.customRoutines={};
  if(!S.customRoutines.default) S.customRoutines.default=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  S.customRoutines.default.splice(i,1);
  persist();render();
}

window.resetRoutine=function(){
  if(confirm('Reset to default routine?')){
    if(S.customRoutines) delete S.customRoutines.default;
    persist();render();
  }
}

window.exportData=function(){
  const data=JSON.stringify({app:'barbell-coach',routineVersion:S.routineVersion,exported:new Date().toISOString(),
    sessions:S.sessions,customRoutines:S.customRoutines,routinePointer:S.routinePointer},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(data);
  a.download='barbell-coach-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

window.importData=function(input){
  const file=input.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const incoming=normalizeSessions(Array.isArray(d)?d:d.sessions);
      if(!incoming.length){alert('Import failed: no sessions found in file.');return;}
      // Merge: keep everything already here, add any session from the file that isn't here yet (matched by id)
      const byId=new Map(S.sessions.map(x=>[x.id,x]));
      let added=0;
      incoming.forEach(x=>{if(!byId.has(x.id)){byId.set(x.id,x);added++;}}); // existing sessions are kept as-is
      S.sessions=normalizeSessions([...byId.values()]);
      if(d.customRoutines) S.customRoutines=d.customRoutines;
      if(d.routinePointer!==undefined) S.routinePointer=d.routinePointer;
      applyMigrations(d.routineVersion);
      persist();render();
      alert('Import successful! '+added+' new session(s) added, '+S.sessions.length+' total.');
    }catch(err){alert('Import failed: invalid file.');}
  };
  reader.readAsText(file);
}

window.confirmClearData=function(){
  if(confirm('Clear ALL data? This cannot be undone.')){
    S.sessions=JSON.parse(JSON.stringify(SEED_SESSIONS));
    S.customRoutines={};
    S.routinePointer=initialPointer();
    persist();render();
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
if(S.routinePointer===null||S.routinePointer===undefined) S.routinePointer=initialPointer();
load();
render();
</script>
